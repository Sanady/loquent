version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      uv-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The dev pin (<4.10) is tied to pymongo-inmemory; CI tests the real range itself.
      - dependency-name: pymongo

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
