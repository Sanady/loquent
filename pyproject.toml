[project]
name = "loquent"
version = "0.1.0"
description = "Serve a chat UI over AG-UI, the open agent-to-UI protocol."
requires-python = ">=3.11"
dependencies = [
    "ag-ui-protocol",
    "starlette",
    "uvicorn",
    "pydantic>=2",
    "aiosqlite",
    "httpx",
    "pydantic-settings>=2.16.3",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
mongo = [
    "pymongo>=4.9",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "fastapi",
    "pymongo-inmemory>=0.5.0",
    "pymongo>=4.9,<4.10",  # pymongo-inmemory ships mongod <=4.0; newer pymongo needs >=4.4
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loquent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
