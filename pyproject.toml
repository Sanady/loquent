[project]
name = "loquent"
version = "0.1.0"
description = "Chat UI for any LLM or AI agent in a few lines of Python. AG-UI native, Chainlit alternative."
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "chat ui",
    "llm",
    "ai agent",
    "chatbot",
    "ag-ui",
    "chainlit alternative",
    "langgraph",
    "openai",
    "ollama",
    "streaming",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: User Interfaces",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ag-ui-protocol>=1.0,<2",
    "starlette>=1.10",
    "uvicorn>=0.54",
    "pydantic>=2",
    "aiosqlite",
    "httpx>=0.28",
    "pydantic-settings>=2.16",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.34",
]

[project.urls]

Homepage = "https://github.com/Sanady/loquent"
Source = "https://github.com/Sanady/loquent"
Issues = "https://github.com/Sanady/loquent/issues"
Changelog = "https://github.com/Sanady/loquent/blob/main/CHANGELOG.md"


[project.scripts]
loquent = "loquent.cli:main"

[project.optional-dependencies]
mongo = [
    "pymongo>=4.9",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "fastapi",
    "pymongo-inmemory>=0.5.0",
    "pymongo>=4.9,<4.10",  # pymongo-inmemory ships mongod <=4.0; newer pymongo needs >=4.4
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loquent"]
# The UI build output is gitignored; ship it anyway (written by hatch_build.py).
artifacts = ["src/loquent/server/static/**"]

[tool.hatch.build.targets.sdist]
# frontend/ sources are included so a wheel can be rebuilt from the sdist.
include = ["/src", "/frontend", "/tests", "/hatch_build.py", "/README.md", "/LICENSE", "/CHANGELOG.md"]
exclude = ["node_modules", "test-results", "playwright-report", "__pycache__"]

[tool.hatch.build.hooks.custom]
# hatch_build.py: npm ci && npm run build in frontend/ (skip with LOQUENT_SKIP_UI_BUILD=1).

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "mongo: contract tests that need a real MongoDB (fail, not skip, under CI)",
    "slow: builds the wheel and sdist (run with -m slow, skip with -m 'not slow')",
]

[tool.ruff]
line-length = 100
